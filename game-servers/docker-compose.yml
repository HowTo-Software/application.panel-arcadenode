# Image builds only. See deploy/README.md for managed provisioning.
services:
  minecraft:
    profiles: [image-build]
    build: ./minecraft
    image: arcadenode/minecraft:secure
    # Build only: accidental `up` exits without launching a game or publishing ports.
    entrypoint: ['/bin/sh', '-c', 'echo Use the enrolled panel to provision games >&2; exit 1']
    user: '10001:10001'
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 16
    mem_limit: 32m
  minecraft-bedrock:
