services:
  backend:
    build: ./backend
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      AllowedHosts: ${PANEL_HOST:?Set PANEL_HOST to the public DNS name}
      Database__ConnectionStringFile: /run/secrets/database_connection
      Jwt__KeyFile: /run/secrets/jwt_key
      Security__DataProtectionKeyDirectory: /var/lib/arcadenode/keys
      NodeConfigurationPath: /etc/arcadenode/nodes.json
      Security__TrustedProxies__0: 172.30.0.10
    secrets:
      - database_connection
      - jwt_key
    volumes:
      - ./cartridges:/app/cartridges:ro
      - data_protection_keys:/var/lib/arcadenode/keys
      - ${NODE_CONFIG_FILE:?Set NODE_CONFIG_FILE}:/etc/arcadenode/nodes.json:ro
      - ${NODE_CERTS_DIR:?Set NODE_CERTS_DIR}:/run/node-certs:ro
    networks:
      panel:
        ipv4_address: 172.30.0.11
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1g
    cpus: 2
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

  frontend:
    build: ./frontend
    ports:
      - '${PANEL_BIND_IP:-127.0.0.1}:443:8443'
    depends_on: [backend]
    secrets:
      - source: tls_certificate
        target: tls_certificate
      - source: tls_private_key
        target: tls_private_key
    networks:
      panel:
        ipv4_address: 172.30.0.10
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 128m
    cpus: 1
    restart: unless-stopped
    logging:
      driver: json-file
      options: {max-size: 10m, max-file: '3'}

  # Explicit maintenance identity; never started by `compose up`.
  migrate:
    profiles: [maintenance]
    build: ./backend
    command: [--migrate]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__ConnectionStringFile: /run/secrets/migration_connection
      Seed__AdminPasswordFile: /run/secrets/admin_password
      Seed__AdminUsername: ${ARCADENODE_BOOTSTRAP_USERNAME:-admin}
      Seed__AdminEmail: ${ARCADENODE_BOOTSTRAP_EMAIL:-admin@panel.local}
      Security__DataProtectionKeyDirectory: /var/lib/arcadenode/keys
      NodeConfigurationPath: /etc/arcadenode/nodes.json
    secrets: [migration_connection, admin_password]
    volumes:
      - data_protection_keys:/var/lib/arcadenode/keys
      - ./cartridges:/app/cartridges:ro
      - ${NODE_CONFIG_FILE:?Set NODE_CONFIG_FILE}:/etc/arcadenode/nodes.json:ro
    networks: [panel]
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 1g

volumes:
  data_protection_keys:

networks:
  panel:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

secrets:
  database_connection:
    file: ${DATABASE_CONNECTION_FILE:?Set DATABASE_CONNECTION_FILE}
  migration_connection:
    file: ${MIGRATION_CONNECTION_FILE:?Set MIGRATION_CONNECTION_FILE}
  jwt_key:
    file: ${JWT_KEY_FILE:?Set JWT_KEY_FILE}
  admin_password:
    file: ${ADMIN_PASSWORD_FILE:?Set ADMIN_PASSWORD_FILE}
  tls_certificate:
    file: ${TLS_CERTIFICATE_FILE:?Set TLS_CERTIFICATE_FILE}
  tls_private_key:
    file: ${TLS_PRIVATE_KEY_FILE:?Set TLS_PRIVATE_KEY_FILE}
